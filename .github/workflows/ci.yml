name: CI

# 三个 job 都不依赖 `just`（CI 环境不预装）——断言逻辑的唯一实现是 scripts/ 下的脚本，
# justfile 只是本机装了 just 时的等价简写。

on: [push, pull_request]

# 最小权限。三个 job 只读代码：跑脚本、编译、测试、上传 artifact。
# `actions/upload-artifact@v4` 不经 `GITHUB_TOKEN` 上传（走 Actions 运行时的 artifact
# 服务，凭 `ACTIONS_RUNTIME_TOKEN`），因此 `contents: read` 之外不需要任何额外权限。
# 将来若加了要写回仓库的步骤（评论 PR、推 tag、发 release），在**那个 job 上**单独提权，
# 不要放宽这里——顶层放宽会把权限一并交给编译第三方 crate 的那两个 job。
permissions:
  contents: read

# 同仓库分支推送 + 由它开的 PR 会各触发一次，两次跑的是同一个 commit。
# group 里用 `head_ref || ref_name` 而不是 `github.ref`：pull_request 事件的
# `github.ref` 是 `refs/pull/N/merge`、push 是 `refs/heads/X`，两者永不相等，
# 拿它分组等于一个组都没合并、双跑照旧。`head_ref`（PR 事件 = 源分支名）与
# `ref_name`（push = 分支名）在同一分支上取值相同，才真的落进同一个组。
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # 依赖方向断言 + 密钥卫生 + engine 选择集的 lint/test/coverage。
  engine:
    name: engine
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # `rustfmt` 显式列出，不靠 `stable` 的默认 profile 捎带。默认 profile 今天确实
      # 带 rustfmt，但那是一个**默认值**而不是一个承诺：它哪天变了，下面那步会以
      # 「找不到 rustfmt」的形态失败，而不是以「格式不合」的形态失败——两者的红长得
      # 不一样，但都是红，很容易被当成一回事修错方向。写出来它就不再取决于默认值。
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview, rustfmt

      # 排在本 job 的最前面（在 checkout 与工具链之后的第一条实质步骤），理由与
      # `check-secrets.sh` 把 selftest 排在 scan 之前、frontend job 把 lint 排在
      # test 之前同源：先红的应当是更早、更便宜的那一层。这一步不编译任何东西。
      #
      # 它守的是 rustfmt.toml 里写下的那个决定（空文件 = 显式采用默认风格）。
      # 没有这一步，那个文件就只是一句声明——格式差异会照常累积且 CI 照常绿，
      # 而这正是它从 plan 01-03 一路悬到 01-28 的原因。
      #
      # 断言逻辑的唯一实现是 `cargo fmt` 自身；`just fmt-check` 是本机的等价简写。
      - name: Format check (rustfmt default style)
        run: cargo fmt --all -- --check

      # 单一 workspace 下产物落在仓库根 target/；缓存指向 shell 子目录下的构建目录
      # 会 miss（它已不存在），后果是每次全量重编。
      #
      # key 与 restore-keys 都带 `engine` 段。改动前 engine 的 restore-keys
      # （`<os>-cargo-`）是 shell job key（`<os>-cargo-shell-…`）的**前缀**，于是
      # engine job 能恢复 shell 的 target/。两个 job 编译的 feature 集不同（这边不带
      # `prismdocs-shell/test`，那边带），互相恢复今天无害，但会在 feature 差异变大时
      # 制造只在 CI 上出现、本机复现不出的构建差异。现在两段互不为前缀。
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ./target
          key: ${{ runner.os }}-cargo-engine-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-engine-

      - name: Dependency-direction assertions
        run: bash scripts/check-deps.sh all

      # 显式写 all（= selftest + scan）而不是靠无参数默认值：默认值哪天改回 scan-only，
      # CI 会静默失去 selftest 那一半并照常绿——而 selftest 正是「扫描器没瞎」的唯一证据。
      - name: Plaintext secret scan (pattern selftest + repo scan)
        run: bash scripts/check-secrets.sh all

      # `prism-cli` 与八个 engine crate 并进同一次调用：三者的 feature 面相同，
      # 且它按 D-10 与 D-01 一样是 tauri-free 的。Tauri 壳的 clippy 不能并进来——
      # 它必须带 `--features test`，因此落在 shell job（理由见那边的注释）。
      - name: Clippy (engine selection set + CLI helper)
        run: cargo clippy -p prism-types -p prism-store -p prism-fs -p prism-parse -p prism-anchor -p prism-llm -p prism-mcp -p prism-engine -p prism-cli -- -D warnings

      # `prism-cli` 进这一步是为了让它成为一条**声明的**闸门。此前它的测试只作为
      # `cargo llvm-cov --workspace` 的副作用被跑到——那是一条偶然的闸门，而下面那步
      # 一收窄范围它就彻底没人跑了。
      - name: Test (engine selection set + CLI helper)
        run: cargo test -p prism-types -p prism-store -p prism-fs -p prism-parse -p prism-anchor -p prism-llm -p prism-mcp -p prism-engine -p prism-cli

      - uses: taiki-e/install-action@cargo-llvm-cov

      # Phase 1 只测量与呈报，不设 --fail-under —— 理由与 Phase 2 的交接见 01-02-SUMMARY.md
      #
      # 范围 = 八个 engine crate，与本步骤的标题、与上面 clippy/test 的「engine 选择集」
      # 以及 `just test-engine` 是同一个集合。改动前是 `--workspace`：它把 Tauri 壳一并
      # 测量却**不带** `--features test`，于是 tests/ipc.rs 因 feature gate 编译成零个测试，
      # 而得到的数字以 `### Engine coverage` 之名发布——Phase 2 要开的硬闸门，基线不能是
      # 一个和它的标签不同范围的读数。`prism-cli` 刻意不进这个范围：按 D-10 它不是 engine
      # crate（依赖树里不许出现任何 prism-*），它的测试由上面那条声明的 cargo test 看住。
      #
      # `clean --workspace` 不是保险动作，是范围断言的一部分。`./target` 进了缓存，里面
      # 可能留着上一次运行（或上一个范围）的 llvm-cov 对象，而 `report` 汇总的是它在目录里
      # 找到的全部对象，不是本次 `--no-report` 点名的那些。本机实测：不 clean 时收窄后的
      # 报告里 src-tauri/src/* 仍然以 0.00% 出现并计入 TOTAL——范围与标题当场又不一致了。
      - name: Coverage (engine)
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report -p prism-types -p prism-store -p prism-fs -p prism-parse -p prism-anchor -p prism-llm -p prism-mcp -p prism-engine
          cargo llvm-cov report --summary-only | tee coverage-summary.txt
          cargo llvm-cov report --lcov --output-path lcov.info
          {
            echo '### Engine coverage'
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: engine-coverage-lcov
          path: lcov.info

  # 单独一个 job：Tauri 薄 shell 的测试必须带 feature 选择，否则 tests/ipc.rs
  # 因 #![cfg(feature = "test")] 编译为零个测试并照常退出 0（绿灯却什么都没测）。
  shell:
    name: shell
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ./target
          key: ${{ runner.os }}-cargo-shell-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-shell-

      # 壳的 clippy 落在这个 job 而不是 engine job：两个 flag 都是承载性的，而它们只在
      # 这里成立。`--all-targets` 与 `--features test` 缺任何一个，tests/ipc.rs 都不进
      # clippy 的受检面（本机实测：往该文件插一处 needless_return，四种组合中只有
      # `--all-targets --features test` 退出非零，另外三种照常退出 0）。
      # 放进 engine job 会让那个 job 也编译 Tauri 壳的 test feature 面，与它自己的缓存
      # 分段（`-cargo-engine-`）以及「两个 job 编译不同 feature 集」这个前提直接矛盾。
      - name: Clippy (Tauri shell, feature-gated IPC tests included)
        run: cargo clippy -p prismdocs-shell --all-targets --features test -- -D warnings

      - name: Test (Tauri shell, feature-gated IPC tests included)
        run: cargo test -p prismdocs-shell --features test

  frontend:
    name: frontend
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # package-lock.json 由 npm 11 生成，必须由 npm 11 校验。node 22 自带的是 npm 10，
      # 两者对「本平台用不上的 optional 包」的 peerDependencies 处理不同：npm 11 不给它
      # 解析 peer（锁文件因此不含 @emnapi/core|runtime 两条），npm 10 会解析、找不到、
      # 报 EUSAGE 拒装。首次真实 CI 运行（run 30508455439）就是这么红的——本机 `npm ci`
      # 全绿，因为本机是 npm 11。锁文件没坏，坏的是两边 npm 不同版本。
      #
      # 升级 npm 时两边必须同步改：本机版本 → 这一行 → 重生锁文件。
      - name: Pin npm to the version that generated package-lock.json
        run: npm i -g npm@11

      - run: npm ci

      # 排在测试之前，理由与 `check-secrets.sh all` 把 selftest 排在 scan 之前同源：
      # 先红的应当是更早、更便宜的那一层。
      #
      # 这一步不与下面的 `npm run build`（内含 `tsc --noEmit`）重复：eslint.config.js
      # 刻意只取 tsc 结构性看不见的那一类规则。本机实测——往 src/App.tsx 插一处
      # `console.log`，`npm run lint` 退出 1 而 `npx tsc --noEmit` 退出 0。
      # 断言逻辑的唯一实现在 eslint.config.js，这里只是调用者。
      - name: Lint (frontend)
        run: npm run lint

      - name: Test with coverage
        run: npm run test -- --run --coverage

      - run: npm run build
