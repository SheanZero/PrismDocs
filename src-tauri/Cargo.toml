[package]
name = "prismdocs-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "PrismDocs desktop shell (the only crate that links tauri)"

[lib]
name = "prismdocs_shell"
path = "src/lib.rs"

[[bin]]
name = "prismdocs"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
# `protocol-asset` 已移除：配置侧 `assetProtocol.enable` 与这个 feature 是配套的两半，
# 只关一半等于没关。Phase 4/5 真要渲染本地图片时，两半一起打开并配一个具体的 scope。
tauri = { workspace = true }
prism-engine = { workspace = true }
prism-types = { workspace = true }
prism-store = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }

[features]
test = ["tauri/test"]
